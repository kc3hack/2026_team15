name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  mobile:
    name: Mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd mobile && npm ci && cd ..

      - name: Create .env file for tests
        run: |
          echo "SUPABASE_URL=https://test.supabase.co" > mobile/.env
          echo "SUPABASE_ANON_KEY=test-anon-key" >> mobile/.env

      - name: Lint
        run: npm run mobile:lint

      - name: Typecheck
        run: npm run mobile:typecheck

      - name: Test
        run: npm run mobile:test

      - name: Format check
        run: npm run mobile:format:check
